//
//	Default Config: executed on startup, before the user's config.cfg.
//

unbindall

bind	w			+forward
bind	s			+back
bind	a			+moveleft
bind	d			+moveright
bind	SPACE		+jump
bind	MOUSE1		+attack

bind	ESCAPE		"togglemenu"
bind	~			"toggleconsole"
bind	`			"toggleconsole"
bind	f12			"screenshot"

sensitivity		3
in_rawinput		1
cl_bob			0
sv_public		0
