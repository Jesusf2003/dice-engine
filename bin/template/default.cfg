//
//	Default Config: executed on startup, before the user's config.cfg.
//

unbindall

bind	w			+forward
bind	s			+back
bind	a			+moveleft
bind	d			+moveright
bind	SPACE		+jump
bind	MOUSE1		+attack

bind	ESCAPE		"togglemenu"
bind	~			"toggleconsole"
bind	`			"toggleconsole"
bind	f12			"screenshot"

sensitivity		3
in_rawinput		1
cl_bob			0
sv_public		0

// maps/start.map loads as it is (the engine reads .map files): it has no
// lightmaps, so its light entities light it in realtime
r_shadow_realtime_world							1
r_shadow_realtime_world_importlightentitiesfrommap	1

// the hud shows the messages (cl_hud.qc), not the console's notify lines
con_notifylines		0
