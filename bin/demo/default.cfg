// Default binds and settings of the demo game (exec'd by quake.rc).
// Replaces LibreQuake's default.cfg inside demo/pak0.pak.

unbindall

bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind SPACE +jump
bind SHIFT +speed
bind UPARROW +forward
bind DOWNARROW +back
bind ` toggleconsole
bind ESCAPE togglemenu
bind F12 screenshot

// Mouse look, always on.
+mlook
sensitivity 3

// The engine menu's "New Game" runs startmap_sp.
alias startmap_sp "map room"

// Load the server progs (progs.dat) built from demo/src, never the pak's qwprogs.dat.
sv_progs progs
